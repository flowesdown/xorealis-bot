title: "📜 Гайд по Xorealis: Politi-X"
color: "#3498DB"

pages:
  - title: "Шаг 1: Основание вашего Поселения"
    author_name: "Основы | Страница 1/5"
    author_icon_url: "https://p.novaskin.me/5507803252.png"
    text: |
      **Город** — это ваша личная, защищенная территория.

      **Требования:**
      - Вы должны находиться в диких землях (Wilderness).
      - Стоимость основания: **250 монет**.

      **Команда для создания:**
      ` `/t new [НазваниеГорода]` `
      *Название должно быть уникальным и на латинице.*

  - title: "Шаг 2: Расширение и Рост"
    author_name: "Территория | Страница 2/5"
    author_icon_url: "https://static.wikia.nocookie.net/minecraft_ru_gamepedia/images/e/e6/PlanetMinecraft_%D0%BB%D0%BE%D0%B3%D0%BE%D1%82%D0%B8%D0%BF.png/revision/latest?cb=20170824141252"
    text: |
      Ваш город расширяется за счет **чанков** (территорий 16x16).

      **Приват новых чанков:**
      ` `/t claim` ` - Заприватить чанк, на котором вы стоите. 
      > **Цена:** **25 монет**.
      
      **Как получить больше чанков?**
      - **Приглашайте жителей!** Каждый новый резидент позволяет вашему городу приватить **еще 20 чанков**.
      - **Формула:** `(Количество жителей * 20) = Максимум чанков.`
      > Это самый эффективный способ расширения.

  - title: "Шаг 3: Настройка Безопасности (Очень важно!)"
    author_name: "Безопасность | Страница 3/5"
    author_icon_url: "https://png.klev.club/uploads/posts/2024-04/png-klev-club-d9it-p-shchit-mainkraft-png-5.png"
    text: |
      По умолчанию, **PvP** и **спавн мобов** на вашем сервере **включены везде**. Чтобы сделать ваш город мирной зоной, мэр должен ввести следующие команды:

      **Команды для мэра:**
      - ` `/t toggle pvp` ` - **Отключить** PvP внутри города.
      - ` `/t toggle mobs` ` - **Запретить** спавн враждебных мобов.
      - ` `/t toggle fire` ` - **Запретить** распространение огня.

      *Сделайте это сразу после основания города, чтобы обезопасить себя и своих жителей!*

  - title: "Шаг 4: Экономика и Налоги"
    author_name: "Экономика | Страница 4/5"
    author_icon_url: "https://mcheads.ru/heads/medium/front/fogx.png"
    text: |
      Управление экономикой — ключ к процветанию вашего города и нации.

      **Налоги:**
      - ` `/t set taxes [сумма]` ` - Установить ежедневный налог с каждого жителя. По умолчанию он **процентный** (`taxpercentage: 'true'`).
      
      **Банк города:**
      - ` `/t deposit [сумма]` ` - Положить деньги в казну города.
      
      **Зачем нужна казна?**
      - Для оплаты содержания **нации**. Ваша нация будет ежедневно списывать **100 монет** из казны **каждого** города-участника. Если денег не хватит, вас могут исключить!

  - title: "Шаг 5: Переход к Политике (Нации)"
    author_name: "Политика | Страница 5/5"
    author_icon_url: "https://mcheads.ru/heads/medium/front/tyab.png"
    text: |
      **Нация** — это союз городов для ведения войн, защиты и получения бонусов.

      **Требования для создания:**
      - Быть мэром города, который станет столицей.
      - Иметь **1,000 монет** в казне **города**.

      **Ключевые команды:**
      - ` `/n new [НазваниеНации]` ` - Основать новую нацию.
      - ` `/n invite [НазваниеГорода]` ` - Пригласить другой город в вашу нацию.

      *Создание нации открывает доступ к войнам, альянсам и политической карте сервера!*