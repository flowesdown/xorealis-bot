title: "Правила сервера Classi-X"
intro: "Ниже представлены правила сервера Classi-X, при заходе на сервер каждый автоматически соглашается с ними. Убедительная просьба с ними ознакомиться."
rules:
  - number: "1.1"
    text: "Запрещается использовать ошибки (баги) проекта и передавать информацию о них третьим лицам, за исключением администрации."
    punishment: "Пред/Бан"
    duration: "От 3 часов до 7 дней"
  - number: "1.2"
    text: "Запрещено нелегальное копирование предметов (дюп)."
    punishment: "Пред/Бан"
    duration: "От 3 часов до 7 дней"
  - number: "1.3"
    text: "Запрещено создание багов, которые наносят существенный вред проекту."
    punishment: "Бан"
    duration: "Навсегда"
  - number: "1.4"
    text: "Запрещено нанесение ущерба внешнему виду сервера, включая бомбардировку пустых земель, создание глобальных лесных пожаров и лавакастов."
    punishment: "Пред/Бан"
    duration: "От 3 до 30 дней"
  - number: "1.5"
    text: "Запрещено использование любых сторонних программ, дающих преимущество над другими игроками, таких как X-Ray, Kill Aura, SpeedHack, Fly и т. п."
    punishment: "Бан"
    duration: "От 3 до 14 дней"
  - number: "1.6"
    text: "Запрещается взлом, подбор пароля или вход на чужой аккаунт."
    punishment: "Бан"
    duration: "От 3 до 14 дней"
  - number: "1.7"
    text: "Запрещено использование дополнительных аккаунтов (твинков) без согласия администрации."
    punishment: "При первом нарушении: бан твинка. При повторном нарушении: бан по IP."
    duration: "Навсегда"
  - number: "1.8"
    text: "Запрещено попрошайничество в любой форме, включая просьбы о денежных переводах и передаче игровых ценностей. Также запрещены спам и флуд."
    punishment: "Пред/Мут"
    duration: "От 15 минут до 1 дня"
  - number: "1.9"
    text: "Запрещено гриферство — умышленная порча игрового процесса другим пользователям без выгоды для себя. Это включает в себя любые способы расстроить других пользователей, домогательство и другие действия. Может проявляться в убийстве, ограничении доступа к игровым ресурсам, троллинге в игровом чате и т. п. Гриферство отличается от обычного соревнования тем, что гриферы своими действиями получают лишь садистское удовлетворение."
    punishment: "Пред/Бан"
    duration: "От 3 до 30 дней"
  - number: "1.10"
    text: "Запрещен разбор, воровство или уничтожение незаприваченного игрового имущества, если владелец постройки находится поблизости."
    punishment: "Пред/Бан"
    duration: "От 1 до 5 дней"
  - number: "2.1"
    text: "Запрещено распространять фишинговые ссылки или угрожать взломом аккаунта."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.2"
    text: "Запрещена любая коммерческая деятельность, за исключением официальных пожертвований (донатов) проекту."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.3"
    text: "Запрещено разглашение личных данных других игроков."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "3.1"
    text: "Запрещено оскорбление и унижение персонала проекта."
    punishment: "Пред/Мут"
    duration: "От 30 минут до 7 дней"
  - number: "3.2"
    text: "Запрещена выдача себя за сотрудника администрации проекта."
    punishment: "Пред/Бан"
    duration: "От 1 до 7 дней"
  - number: "3.3"
    text: "Запрещены призывы не покупать привилегии или не играть на проекте."
    punishment: "Пред/Мут"
    duration: "От 1 до 7 дней"
  - number: "3.4"
    text: "Запрещена пропаганда нацистской идеологии и постройка нацистской символики."
    punishment: "Пред/Бан"
    duration: "От 3 до 30 дней"
  - number: "3.5"
    text: "Запрещено использовать приватные регионы в целях блокировки порталов в Эндер-мир (включая обсидиановую платформу) или иным образом мешать проходу в порталы с помощью приватов."
    punishment: "Пред/Удаление региона/Бан"
    duration: "От 3 до 30 дней"
  - number: "3.6"
    text: "Запрещено создание токсичной атмосферы — активный троллинг, провокации, создание чувства преследования, систематические оскорбления или дискриминация других пользователей по любому признаку."
    punishment: "Пред/Бан"
    duration: "От 3 до 30 дней"
  - number: "3.7"
    text: "Запрещены оскорбления и провокации. Оскорбления в шуточной форме разрешены при согласии собеседника, без злоупотребления."
    punishment: "Пред/Мут"
    duration: "От 1 до 3 дней"
  - number: "4.1"
    text: "Администрация может отклоняться от норм наказаний. Наказания являются избирательными, а не последовательными."
    punishment: ""
    duration: ""
  - number: "4.2"
    text: "Администрация оставляет за собой право блокировать проблемных пользователей, которые как-либо создают помехи для работы и развития сервера."
    punishment: ""
    duration: ""
  - number: "4.3"
    text: "Гриферство не приветствуется на сервере Classi-X."
    punishment: ""
    duration: ""
  - number: "4.4"
    text: "Каждый имеет право на создание ивентов и установки правил в нём, которые не перечат правилам проекта XOREALIS."
    punishment: ""
    duration: ""
  - number: "4.5"
    text: "Ивенты — это мероприятия, за прохождение которых выдаются разные игровые награды."
    punishment: ""
    duration: ""
  - number: "4.6"
    text: "Создание токсичной атмосферы, оскорбления, споры и т. д. крайне не приветствуются на сервере Classi-X, любое из данных действий несет за собой получение наказания."
    punishment: ""
    duration: ""
  - number: "4.7"
    text: "PVP не является гриферством, пока оно происходит на специально отведенных местах, предназначенных для PVP или же на дикой местности вне приватов. PVP рассматривается как гриферство, если вы целенаправленно выслеживаете и серийно убиваете игрока, или же начинаете PVP предварительно обманув игрока, к примеру под предлогом того, что вы его приютите."
    punishment: ""
    duration: ""
  - number: "4.8"
    text: "Хранение любых читов подходит под правило 1.5."
    punishment: ""
    duration: ""