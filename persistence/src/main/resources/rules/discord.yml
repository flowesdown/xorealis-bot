title: "Правила Discord-сервера Xorealis"
intro: |
  Наш сервер в первую очередь придерживается правил Discord.
  Discord Terms of Service
  Discord Community Guidelines
rules:
  - number: "1.1"
    text: "Запрещены оскорбления и провокации в адрес участников сервера. Оскорбления в шутливой форме допустимы только с явного согласия собеседника и без злоупотреблений."
    punishment: "Пред/Мут"
    duration: "До 1 часа"
  - number: "1.2"
    text: "Запрещается чрезмерное использование спама, флуда, верхнего регистра (капса), 'зальго' и сообщений в виде 'лесенки' за пределами специально отведенного для этого канала https://discord.com/channels/1154204400269660180/1223807308770054324."
    punishment: "Пред/Мут"
    duration: "До 1 часа"
  - number: "1.3"
    text: "Запрещены любые действия, создающие помехи для комфортного общения других участников."
    punishment: "Пред/Мут"
    duration: "До 1 часа"
  - number: "1.4"
    text: "Запрещается отклоняться от тематики, установленной для конкретного текстового или голосового чата."
    punishment: "Пред/Мут"
    duration: "До 1 часа"
  - number: "1.5"
    text: "Запрещено чрезмерное использование SoundPad и аналогичных программ. Также запрещено использование программ для изменения голоса."
    punishment: "Пред/Мут"
    duration: "До 1 часа"
  - number: "2.1"
    text: "Запрещены намеренные оскорбления, унижения, введение в заблуждение и провокации в адрес администрации сервера. Также запрещено манипулирование правилами сервера в своих интересах."
    punishment: "Пред/Мут"
    duration: "До 12 часов"
  - number: "2.2"
    text: "Запрещены любые деструктивные действия по отношению к серверу и его администрации."
    punishment: "Бан"
    duration: "Навсегда"
  - number: "2.3"
    text: "Запрещены угрозы и распространение личной информации без согласия владельца. Запрещено мошенничество в любом виде."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.4"
    text: "Запрещена реклама любых сторонних ресурсов, а также любая коммерческая деятельность без согласия администрации сервера."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.5"
    text: "Запрещено использование сторонних аккаунтов в целях обхода наложенных на вас санкций."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.6"
    text: "Запрещено полное копирование профилей других пользователей Discord, включая ботов."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.7"
    text: "Запрещена публикация/трансляция/распространение и использование в своем профиле шокирующего и порнографического контента, политической агрессии, пропаганды наркотиков, терроризма, угроз, нацизма, расизма, шовинизма и подобного."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.8"
    text: "Запрещается распространение и пропаганда наркотиков, суицида, терроризма, расизма, нацизма, шовинизма и подобного."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.9"
    text: "Запрещается дискриминация на почве расовой, национальной, половой или религиозной принадлежности."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "3.1"
    text: "Администрация может отклоняться от норм наказаний. Наказания являются избирательными, а не последовательными."
    punishment: ""
    duration: ""
  - number: "3.2"
    text: "Администрация оставляет за собой право блокировать проблемных пользователей, которые как-либо создают помехи для работы и развития сервера."
    punishment: ""
    duration: ""
  - number: "3.3"
    text: "Запрещается создавать роли и каналы, нарушающие Discord TOS, а также использовать цвет, приближенный к фону чата, и копировать роли."
    punishment: ""
    duration: ""
  - number: "3.4"
    text: "Использование тикетов и отправка заявок на стафф/ивенты/идеи в шуточной форме может караться не только блокировкой этих возможностей, но и таймаутом/баном."
    punishment: ""
    duration: ""
  - number: "3.5"
    text: "После входа на сервер вы автоматически соглашаетесь и принимаете правила сервера. В правила могут вноситься изменения без оповещения участников."
    punishment: ""
    duration: ""