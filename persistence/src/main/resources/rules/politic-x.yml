title: "Правила сервера Politi-X"
intro: "Ниже представлены правила сервера Politi-X, при заходе на сервер каждый автоматически соглашается с ними. Убедительная просьба с ними ознакомиться."
rules:
  - number: "1.1"
    text: "Запрещается использовать программные ошибки проекта и передавать информацию о них третьим лицам, за исключением администрации."
    punishment: "Пред/Бан"
    duration: "От 3 часов до 3 дней"
  - number: "1.2"
    text: "Запрещено нелегальное копирование предметов."
    punishment: "Пред/Бан"
    duration: "От 3 часов до 7 дней"
  - number: "1.3"
    text: "Запрещено создание багов, которые приносят существенный вред проекту."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "1.4"
    text: "Запрещено уничтожение внешнего вида сервера, включая бомбардировку пустых земель, создание глобальных лесных пожаров и лавакастов."
    punishment: "Пред/Бан"
    duration: "От 3 часов до 7 дней"
  - number: "1.5"
    text: "Запрещено использование любых сторонних программ, которые дают преимущество над другими игроками, таких как X-Ray, Kill Aura, SpeedHack, Fly и так далее."
    punishment: "Пред/Бан"
    duration: "От 1 до 14 дней"
  - number: "1.6"
    text: "Запрещается взлом, подбор пароля или вход на чужой аккаунт."
    punishment: "Бан"
    duration: "От 3 до 14 дней"
  - number: "1.7"
    text: "Использование твинков без согласия администрации запрещено."
    punishment: "При первом нарушении: бан твинка. При повторном нарушении: бан по IP."
    duration: "Навсегда"
  - number: "1.8"
    text: "Запрещено попрошайничество в любой форме, включая просьбы о переводах денежных средств, о передаче игровых ценностей и другие просьбы. Также запрещены спам и флуд."
    punishment: "Пред/Мут"
    duration: "От 15 минут до 1 дня"
  - number: "2.1"
    text: "Запрещено распространять фишинговые ссылки или угрожать взломом аккаунта."
    punishment: "Бан"
    duration: "Навсегда"
  - number: "2.2"
    text: "Запрещена любая коммерческая деятельность, за исключением официальных донатов."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "2.3"
    text: "Запрещено разглашение личных данных других игроков."
    punishment: "Пред/Бан"
    duration: "Навсегда"
  - number: "3.1"
    text: "Запрещено оскорбление и унижение персонала проекта."
    punishment: "Пред/Мут"
    duration: "От 30 минут до 7 дней"
  - number: "3.2"
    text: "Запрещена выдача себя за сотрудника администрации проекта."
    punishment: "Пред/Бан"
    duration: "От 1 до 7 дней"
  - number: "3.3"
    text: "Запрещены призывы не покупать привилегии или не играть на проекте."
    punishment: "Пред/Мут"
    duration: "От 1 до 7 дней"
  - number: "3.4"
    text: "Запрещена пропаганда нацистской идеологии и постройка нацистской символики."
    punishment: "Пред/Бан"
    duration: "От 1 до 3 дней"
  - number: "3.5"
    text: "Запрещено использовать приваты в целях блокировки порталов в Эндер-мир (включая обсидиановую платформу) или каким-либо образом мешать проходу в эндер-порталы при помощи приватов."
    punishment: "Пред/Удаление региона/Бан"
    duration: "От 1 до 7 дней"
  - number: "3.6"
    text: "Запрещена значительная порча ландшафта вокруг города, если вы не находитесь в состоянии войны. Значительной порчей ландшафта является его изменение в худшую сторону по сравнению с изначальным видом."
    punishment: "Пред/Бан"
    duration: "От 1 до 7 дней"
  - number: "3.7"
    text: "Запрещено рейдерство городов, создание помех для строительства или игры в пределах чужого привата и на расстоянии до 1 чанка вокруг него вне состояния войны."
    punishment: "Пред/Бан"
    duration: "От 1 до 7 дней"
  - number: "3.8"
    text: "Запрещена чрезмерная агрессия без повода и чрезмерное употребление оскорблений в мирное время."
    punishment: "Пред/Мут"
    duration: "От 12 часов до 7 дней"
  - number: "3.9"
    text: "Запрещена любая помеха игре новичкам в течение 3 дней после их регистрации. (Объявление войны разрешено любому городу по истечении 3 дней с момента его создания, вне зависимости от количества новичков в нём. На нации данное правило не распространяется, объявление войны нации разрешено с момента её создания.)"
    punishment: "Пред/Бан"
    duration: "От 1 до 7 дней"
  - number: "3.10"
    text: "Запрещено устраивать масштабные конфликты, подобные войне, в мирное время."
    punishment: "Наказание зависит от масштаба конфликта, в случае крупного конфликта может проводиться суд. (В большинстве случаев вину будет нести глава города/нации)."
    duration: ""
  - number: "4.1"
    text: "Данный сервер является политическим. Если вы не хотите участвовать в войнах или конфликтах, а желаете мирно строить или комфортно выживать, рекомендуем играть на сервере Classi-X."
    punishment: ""
    duration: ""
  - number: "4.2"
    text: "Администрация может отклоняться от норм наказаний. Наказания являются избирательными, а не последовательными."
    punishment: ""
    duration: ""
  - number: "4.3"
    text: "Администрация оставляет за собой право блокировать проблемных пользователей, которые каким-либо образом создают помехи для работы и развития сервера."
    punishment: ""
    duration: ""
  - number: "4.4"
    text: "В случае крупных нарушений может проводиться суд."
    punishment: ""
    duration: ""
  - number: "4.5"
    text: "На сервере Politi-X свободное PvP отключено. PvP разрешено на PvP-арене и во время любых военных конфликтов. Чтобы изучить, как работают войны, пропишите /eventwar guide."
    punishment: ""
    duration: ""
  - number: "4.6"
    text: "Во время любого типа войны на воюющие города не распространяются следующие правила: 1.4 (на территории воюющих городов и в радиусе 5 чанков от них), 3.6, 3.7, 3.8, 3.9 (касается только новичков, состоящих в городе/нации одной из воюющих сторон). Чтобы изучить, как работают войны, пропишите /eventwar guide."
    punishment: ""
    duration: ""
  - number: "4.7"
    text: "Хранение любых читов подпадает под правило 1.5."
    punishment: ""
    duration: ""
  - number: "4.8"
    text: "Перед каждым вайпом на сервере Politi-X проводится событие 'Судная ночь'. Во время этого события отключаются все приваты, города и нации. Игроки вправе делать что угодно, кроме нарушения действующих правил. Во время 'Судной ночи' не действуют правила: 1.2, 1.4, 3.4, 3.5, 3.6, 3.7, 3.8, 3.9, 3.10."
    punishment: ""
    duration: ""